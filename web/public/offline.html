<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · NutriCoach</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f5f8f5; color: #1b2a23; padding: 24px; box-sizing: border-box; }
      @media (prefers-color-scheme: dark) { body { background: #111614; color: #eef3f0; } }
      main { max-width: 320px; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { opacity: 0.7; line-height: 1.5; margin: 0 0 20px; }
      button { font: inherit; border: 0; border-radius: 12px; padding: 12px 20px; background: #16865a; color: #fff; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Check your connection. Your logs are saved on the server, so nothing is lost.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
